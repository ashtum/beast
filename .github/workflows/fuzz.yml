name: fuzz

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "25 00 * * *"

concurrency:
  group: ${{format('{0}:{1}:{2}', github.repository, github.workflow, github.ref)}}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          linux-local-args: '["--toolkit"]'

      - name: Setup Boost
        run: |
          echo GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          LIBRARY=${GITHUB_REPOSITORY#*/}
          echo LIBRARY: $LIBRARY
          echo "LIBRARY=$LIBRARY" >> $GITHUB_ENV
          echo GITHUB_BASE_REF: $GITHUB_BASE_REF
          echo GITHUB_REF: $GITHUB_REF
          REF=${GITHUB_BASE_REF:-$GITHUB_REF}
          REF=${REF#refs/heads/}
          echo REF: $REF
          BOOST_BRANCH=develop && [ "$REF" == "master" ] && BOOST_BRANCH=master || true
          echo BOOST_BRANCH: $BOOST_BRANCH
          cd ..
          git clone -b $BOOST_BRANCH --depth 1 https://github.com/boostorg/boost.git boost-root
          cd boost-root
          cp -r $GITHUB_WORKSPACE/* libs/$LIBRARY
          git submodule update --init tools/boostdep
          python tools/boostdep/depinst/depinst.py --git_args "--jobs 3" $LIBRARY
          cd libs/$LIBRARY
          mkdir build && cd build
          cmake -DBUILD_TESTING=OFF -DCMAKE_CXX_COMPILER=nvcc -DCMAKE_C_COMPILER=nvcc -DCMAKE_CXX_LINK_FLAGS="-m64 -ccbin aarch64-linux-gnu-g++" -DCMAKE_C_LINK_EXECUTABLE="nvcc -m64 -ccbin aarch64-linux-gnu-g++" ..
          make -j 4

  